name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install zizmor
        run: pip install zizmor
      - name: Run zizmor
        # Only block CI on high-severity findings. Pre-existing
        # `secrets-outside-env` warnings in publish*.yml (medium) and
        # `artipacked` (low) are acknowledged trade-offs for a
        # solo-maintainer public repo. Config at .github/zizmor.yml
        # also suppresses `cache-poisoning` for publish workflows and
        # accepts ref-pin (tag) instead of hash-pin.
        run: zizmor --min-severity=high .github/workflows/
