name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install zizmor
        run: pip install zizmor==1.28.0
      - name: Run zizmor
        # Only block CI on high-severity findings. Pre-existing
        # `secrets-outside-env` warnings in publish*.yml (medium) and
        # `artipacked` (low) are acknowledged trade-offs for a
        # solo-maintainer public repo. Config at .github/zizmor.yml
        # also suppresses `cache-poisoning` for publish workflows and
        # accepts ref-pin (tag) instead of hash-pin.
        run: zizmor --min-severity=high .github/workflows/
