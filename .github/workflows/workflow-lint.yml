name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0
        with:
          advanced-security: auto
          # Only block CI on high-severity findings. Pre-existing
          # `secrets-outside-env` warnings in publish*.yml (medium) are
          # acknowledged design trade-offs for a solo-maintainer repo;
          # `artipacked` (low) is informational. Tighten once the
          # publish workflows are moved behind named environments.
          min-severity: high
