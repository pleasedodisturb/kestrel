name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # release-please needs contents:write (release commits/tags) +
    # pull-requests:write (release PRs). The job actually authenticates via
    # the scoped GitHub App token below, not the default GITHUB_TOKEN, but
    # the job-level grant is kept to match what the action can legitimately
    # need if it ever falls back to the default token. (G-1412)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          # Scope the app token to least privilege — matches the job-level
          # permissions above and exactly what release-please needs. Resolves
          # the zizmor `github-app` finding (unscoped token). Permission
          # scoping does not affect the app token's ability to trigger
          # downstream workflows on the release PR.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
