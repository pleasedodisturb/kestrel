name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # release-please needs contents:write (release commits/tags) +
    # pull-requests:write (release PRs). The job actually authenticates via
    # the scoped GitHub App token below, not the default GITHUB_TOKEN, but
    # the job-level grant is kept to match what the action can legitimately
    # need if it ever falls back to the default token. (G-1412)
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Release hold (FOUND-11, G-2040). While `.release-hold` exists at the
      # repo root this job does nothing: no token, no release PR, no release.
      # Every step below runs only when the guard wrote held=false, so a
      # guard that fails or writes nothing also means "no release".
      # tests/test_release_hold.py asserts this shape.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .release-hold
          sparse-checkout-cone-mode: false

      - name: Check release hold
        id: hold
        run: |
          if [ -e .release-hold ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate token
        id: app-token
        if: steps.hold.outputs.held == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          # Scope the app token to least privilege — matches the job-level
          # permissions above and exactly what release-please needs. Resolves
          # the zizmor `github-app` finding (unscoped token). Permission
          # scoping does not affect the app token's ability to trigger
          # downstream workflows on the release PR.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.hold.outputs.held == 'false'
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
