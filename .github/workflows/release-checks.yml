name: Release Checks

# Heavier or advisory checks that don't need to gate every PR.
# Runs on main pushes (catch regressions early) and on release tags
# (final gate before publish.yml ships the artifacts).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Container build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kestrel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: kestrel:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  frontend-extras:
    name: Frontend extras (size-limit, a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: |
          npm install --no-save --legacy-peer-deps size-limit @size-limit/file
          npx size-limit

      - name: Accessibility smoke check
        continue-on-error: true
        run: |
          npm install --no-save --legacy-peer-deps http-server @axe-core/cli
          npx http-server dist -p 4173 --silent &
          SERVER_PID=$!
          # Single-quote trap body so $SERVER_PID is evaluated at trap
          # fire time (shellcheck SC2064).
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          npx @axe-core/cli http://127.0.0.1:4173 --exit
