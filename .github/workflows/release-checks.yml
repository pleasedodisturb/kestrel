name: Release Checks

# Heavier or advisory checks that don't need to gate every PR.
# Runs on main pushes (catch regressions early) and on release tags
# (final gate before publish.yml ships the artifacts).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Container build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: kestrel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kestrel:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  frontend-extras:
    name: Frontend extras (size-limit, a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run size

      - name: Accessibility smoke check
        continue-on-error: true
        run: |
          npm install --no-save --legacy-peer-deps http-server@14.1.1 @axe-core/cli@4.12.1
          npx http-server dist -p 4173 --silent &
          SERVER_PID=$!
          # Single-quote trap body so $SERVER_PID is evaluated at trap
          # fire time (shellcheck SC2064).
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          npx @axe-core/cli http://127.0.0.1:4173 --exit
