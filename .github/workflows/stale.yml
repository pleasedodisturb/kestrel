name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 14 days if no
            further activity occurs. Thank you for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because
            it has not had recent activity. It will be closed in 7 days if
            no further activity occurs. Thank you for your contributions.
          close-issue-message: >
            This issue was closed because it has been stalled for 14 days
            with no activity.
          close-pr-message: >
            This pull request was closed because it has been stalled for 7
            days with no activity.
          exempt-issue-labels: "pinned,security,good first issue,roadmap"
          exempt-pr-labels: "pinned,security,dependencies"
          operations-per-run: 50
