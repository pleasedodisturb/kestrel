name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem you're
        trying to solve before proposing a solution — this helps us find the
        best approach.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't you currently do, or what's painful about the current behaviour?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? Include UI/UX sketches or API shape if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to related issues, screenshots, use cases, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and discussions for similar requests
          required: true
