  </defs>

  <!-- Background -->
  <rect width="920" height="520" rx="12" fill="#f8fafc"/>
  <rect width="920" height="520" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Nav Bar -->
  <rect width="920" height="48" rx="12" fill="#ffffff"/>
