  <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">Kestrel</text>
  <text x="95" y="30" font-size="11" fill="#64748b">Pipeline</text>
  <rect x="155" y="12" width="72" height="26" rx="6" fill="#f1f5f9"/>
