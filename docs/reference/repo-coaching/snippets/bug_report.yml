name: bug_report
description: Something broken? File it here.
title: "[bug]: "
labels: ["type/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please complete the form below — fields marked required block submission.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `<your-cli> --version` (or release tag).
      placeholder: "v1.2.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, language runtime, browser, or whatever's relevant.
      placeholder: "macOS 14.5 / Python 3.12 / Chrome 124"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal repro. If we can't reproduce it, we usually can't fix it.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, screenshots.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, related issues, attempted workarounds.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
