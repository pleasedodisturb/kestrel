coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 1%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "src/career_os/_alembic/**"
  - "src/career_os/_frontend_dist/**"
  - "tests/**"
  - "tools/**"
