[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-app"
version = "0.26.0"
description = "AI-powered job search platform. Self-hosted, open-source, privacy-first."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Kestrel Contributors"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0",
    "alembic>=1.15.0",
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.21.0",
    "rich>=13.9.0",
    "icalendar>=7.0.0",
    "slowapi>=0.1.9",
    "cryptography>=42.0.0",
    "rapidfuzz>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/pleasedodisturb/kestrel"
Repository = "https://github.com/pleasedodisturb/kestrel"
Documentation = "https://github.com/pleasedodisturb/kestrel/blob/main/docs/QUICKSTART.md"
"Bug Tracker" = "https://github.com/pleasedodisturb/kestrel/issues"

[project.optional-dependencies]
warn = [
    "warn-scraper>=0.4.0",
]
# Optional: the standalone Kestrel MCP server (tools/kestrel-mcp/server.py).
# Only needed to run that server or its tests; the core app never imports it.
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.1.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
    "httpx>=0.28.0",
    # setuptools>=83.0.0 closes PYSEC-2026-3447 (advisory against <83.0.0). Declared
    # here (not just build-system.requires) so `pip install -e .[dev]` upgrades it in
    # the environment the CI `pip-audit` step scans. Remove the floor if a future
    # advisory forces a different pin.
    "setuptools>=83.0.0",
    # pandas 3.0 evaluation (G-251): blocked by python-jobspy which pins
    # pandas<3.0.0. Kestrel's own usage is compatible (tested), but the
    # transitive constraint prevents upgrading. Revisit when jobspy relaxes.
    "pandas>=2.2.0,<4",
    "python-jobspy>=1.1.82,<1.2",
    "fpdf2>=2.8.0",
    # Dev-only oracle for the scoring eval harness (G-1336): the production
    # metric math (weighted κ, NDCG, PSI) is pure-Python in
    # career_os.services.scoring_eval — scikit-learn is used ONLY in
    # tests/eval to cross-check those implementations against a reference.
    # Not a runtime dependency; the shipped package never imports it.
    "scikit-learn>=1.4",
    # Powers the property-based test tier (tests/property/ + tests/geo/) via Hypothesis.
    "hypothesis>=6.100",
]

[project.scripts]
kestrel = "career_os.cli.main:app"
career = "career_os.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_os = [
    "_frontend_dist/**/*",
    "_frontend_dist/assets/*",
    "_alembic/*.py",
    "_alembic/*.mako",
    "_alembic/versions/*.py",
    "_alembic.ini",
    "privacy_registry.json",
    "fixtures/*.json",
    "fixtures/*.json.gz",
]

[tool.ruff]
target-version = "py311"
# Alembic scaffolding is generated + historical: linting/reformatting it churns
# files that already ran against production databases, and pre-commit's pinned
# ruff disagrees with CI's floating one on their formatting (G-1350).
extend-exclude = ["src/career_os/_alembic"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's Depends() pattern is a false positive for function-call-in-default-argument
"src/career_os/api/*.py" = ["B008", "E741"]
"src/career_os/cli/*.py" = ["E501", "B008"]
"src/career_os/migration/*.py" = ["E402"]
"src/career_os/models/*.py" = ["E501"]
"src/career_os/services/*.py" = ["E501", "SIM117", "E402"]
"src/career_os/discovery/*.py" = ["E402"]
"tests/*.py" = ["B008", "B017", "E501", "SIM117", "E741", "E402", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
markers = [
    "eval: scoring golden-set agreement eval (G-1336) — runs nightly, excluded from the fast unit run",
    "regression: golden-set fit-score band regression tests",
    "property: property-based tests",
    "fuzz: fuzzing tests",
]

[tool.coverage.run]
# relative_files = true makes pytest-cov emit project-relative source paths in
# coverage.xml instead of absolute runner paths (e.g. /home/runner/work/...).
# SonarCloud matches coverage data against its source index using relative paths,
# so without this setting it cannot associate any coverage and reports 0%.
relative_files = true
