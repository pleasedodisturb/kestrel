[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-app"
version = "0.1.0"
description = "AI-powered job search platform. Self-hosted, open-source, privacy-first."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0",
    "alembic>=1.15.0",
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.21.0",
    "rich>=13.9.0",
    "icalendar>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.1.0",
    "ruff>=0.11.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "python-jobspy>=1.1.0",
    "fpdf2>=2.8.0",
]

[project.scripts]
kestrel = "career_os.cli.main:app"
career = "career_os.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_os = [
    "_frontend_dist/**/*",
    "_frontend_dist/assets/*",
    "_alembic/*.py",
    "_alembic/*.mako",
    "_alembic/versions/*.py",
    "_alembic.ini",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's Depends() pattern is a false positive for function-call-in-default-argument
"src/career_os/api/*.py" = ["B008", "E741"]
"src/career_os/cli/*.py" = ["E501"]
"src/career_os/migration/*.py" = ["E402"]
"src/career_os/models/*.py" = ["E501"]
"src/career_os/services/*.py" = ["E501", "SIM117", "E402"]
"src/career_os/discovery/*.py" = ["E402"]
"tests/*.py" = ["B008", "B017", "E501", "SIM117", "E741", "E402", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
