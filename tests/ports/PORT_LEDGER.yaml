# Script ledger (v2.0 Phase 11 Map, MAP-01, decision D-06).
#
# One row per file under tools/ and per scheduler-glue file (every file under
# automation/ and every workflow other than ci.yml that runs something from
# tools/). tests/ports/test_script_ledger.py derives the swept file set from the
# filesystem and fails when a file has no row, matches two rows, or a row matches
# no file. Rows are sorted by their path (or glob) key.
#
# Map seeds run_status and disposition only. Retire adds its lifecycle fields
# (port_status, proof, golden, verified_at) to these rows. Rows for the private
# pipeline live in tests/ports/PORT_LEDGER_PRIVATE.yaml under anonymous ids
# (crossed by plan 11-05); none of them may be named here.
#
# Row keys
#   path        exact repo-relative file, or a directory ending in "/" that covers
#               every file under it (exactly one of path or glob per row)
#   glob        fnmatch pattern over repo-relative POSIX paths
#   run_status  scheduled | by_hand | dead
#   trigger     required when scheduled
#   inputs, outputs   short plain descriptions
#   disposition port | keep_until_retire | delete
#   target      required for port: "TBD:Phase NN" (provisional phase that ports it)
#   reason      required for dead and delete; also records which source wins when
#               REQUIREMENTS.md overrides ARCHITECTURE.md section 10
#   tests       test files that exist and mention the script stem
#   relocate    optional: where the file moves instead of dying with tools/
#
# Disposition values marked "candidate" are proposals for the maintainer, not
# decisions (RESEARCH A6: confirm no hidden user before deleting).
schema: 1
rows:
  - path: .github/workflows/daily-scan.yml
    run_status: scheduled
    trigger: "daily-scan.yml via daily_pipeline (job gated off, no successful run in the listed history)"
