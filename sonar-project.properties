sonar.projectKey=pleasedodisturb_kestrel
sonar.organization=pleasedodisturb

# Exclude CI/CD plumbing, infra config, generated assets, fixtures, and
# legacy alembic migrations from SonarCloud's analysis. SonarCloud's
# Security Hotspots on shell snippets, hardcoded localhost URLs, and
# regex patterns inside workflow files produce noise that isn't
# representative of application risk. Linting of workflow files is
# handled separately by actionlint + zizmor.
sonar.exclusions=\
  .github/**,\
  assets/**,\
  docs/**,\
  worker/**,\
  npm-package/**,\
  tests/fixtures/**,\
  alembic/versions/**,\
  src/career_os/_alembic/**,\
  src/career_os/_frontend_dist/**,\
  frontend/dist/**,\
  frontend/node_modules/**,\
  **/*.min.js,\
  **/*.min.css,\
  tools/**

sonar.python.version=3.11

sonar.test.inclusions=tests/**,frontend/src/__tests__/**

# Suppress hardcoded-credential / cleartext-storage rules in test files —
# test fixtures use obviously-fake strings like "test-fake-anthropic-key"
# that trigger S2068/S6437. Also suppress clear-text protocol warnings on
# the Ollama provider which intentionally connects to a local HTTP server,
# and credential rules on AI provider modules that must pass API keys to
# external services via headers — this is standard authenticated API usage.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S6437
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=src/career_os/ai/ollama_provider.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=src/career_os/ai/anthropic_provider.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S6437
sonar.issue.ignore.multicriteria.e5.resourceKey=src/career_os/api/oauth.py
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e6.resourceKey=src/career_os/api/oauth.py

# Treat `config/personal.yaml.example` as a template, not real config.
sonar.cpd.exclusions=config/personal.yaml.example
