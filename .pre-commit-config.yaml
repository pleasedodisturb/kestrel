repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  # pre-commit/mirrors-prettier was archived in March 2024.
  # rbubley/mirrors-prettier is the actively-maintained fork.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|js|jsx|css|json|md)$
        exclude: ^frontend/(dist|node_modules)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-trivial-assertions
        name: Block trivial assertions in tests
        entry: python3 .claude/hooks/check-trivial-assertions.py
        language: system
        types: [python]
        files: ^tests/
        pass_filenames: true
