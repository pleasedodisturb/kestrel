<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Kestrel falcon badge">
  <title>Kestrel badge</title>
  <!--
    Circular badge variant intended for use as app icon / favicon source.
    Dark navy background (#1E293B), rusty falcon in center, amber rim accent.
  -->

  <!-- Dark navy disk background -->
  <circle cx="48" cy="48" r="46" fill="#1E293B" stroke="#F5A623" stroke-width="2" />

  <!-- Falcon silhouette (same layout as logo-icon, offset to center of 96 viewport) -->
  <g transform="translate(16 16)">
    <!-- Left wing -->
    <path
      d="M 30 24 L 6 8 L 10 24 L 22 28 Z"
      fill="#D4572A"
      stroke="#F5A623"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Right wing -->
    <path
      d="M 34 24 L 58 10 L 56 28 L 42 30 Z"
      fill="#D4572A"
      stroke="#F5A623"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Body -->
    <path
      d="M 32 22 Q 22 34 26 50 L 32 58 L 38 50 Q 42 34 32 22 Z"
      fill="#D4572A"
      stroke="#F5A623"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <!-- Tail feathers -->
    <path d="M 28 52 L 32 58 L 36 52" fill="none" stroke="#F5A623" stroke-width="1.2" stroke-linecap="round" />
    <!-- Head -->
    <path
      d="M 32 12 Q 42 12 44 22 L 40 26 L 28 26 Q 24 20 32 12 Z"
      fill="#D4572A"
      stroke="#F5A623"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <!-- Hooked beak -->
    <path
      d="M 44 20 L 52 19 L 49 24 L 44 24 Z"
      fill="#F5A623"
      stroke="#F5A623"
      stroke-width="0.8"
      stroke-linejoin="round"
    />
    <!-- Eye -->
    <circle cx="38" cy="19" r="2" fill="#F5A623" />
    <circle cx="38.5" cy="19" r="0.9" fill="#1E293B" />
  </g>
</svg>
