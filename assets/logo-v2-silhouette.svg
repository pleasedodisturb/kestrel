<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Kestrel Logo v2 - Concept A: Bold Silhouette</title>
  <desc>Single-color falcon silhouette with negative space eye. The pointed wing is the defining feature.</desc>

