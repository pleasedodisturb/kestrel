<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Kestrel Logo v2 - Concept B: Circle Negative Space</title>
  <desc>Dark circle with kestrel falcon cut out as negative space. The bird IS the empty space.</desc>

