    CONCEPT B: Circle with Negative Space Bird
    - Dark circle, bird is the ABSENCE of color
    - Eye becomes a filled dot inside the cutout
    - Very bold badge/icon format
    - fill-rule="evenodd": circle=filled, bird=hole, eye=filled-dot-in-hole
  -->

