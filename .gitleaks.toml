# Gitleaks configuration for Kestrel.
# Extends the default ruleset with project-specific allowlists.

[extend]
useDefault = true

[allowlist]
description = "Allowlisted paths and regexes for Kestrel"

paths = [
  '''\.github/pii-patterns\.txt$''',
  '''config/personal\.yaml\.example$''',
  '''tests/fixtures/.*''',
  '''docs/.*''',
  # Test files that use placeholder API keys for mocking providers
  '''tests/test_anthropic_provider\.py$''',
  '''tests/test_oauth\.py$''',
  '''tests/test_ai_health\.py$''',
  '''tests/test_registry_integration\.py$''',
  '''tests/test_auth\.py$''',
  # Claude skill knowledge bases contain example JWT/API tokens in documentation
  '''\.claude/skills/.*''',
  '''_bmad/.*''',
]

regexes = [
  # Example placeholder API keys used in docs/examples
  '''(?i)your[-_]?api[-_]?key[-_]?here''',
  '''(?i)sk-example''',
  '''(?i)example[-_]?token''',
  # API key prefix/placeholder patterns in validation and schema code
  '''sk-ant-\.\.\.''',
]
